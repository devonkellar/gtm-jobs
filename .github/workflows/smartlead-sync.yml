# Smartlead reply sync -- the first job migrated off the laptop.
#
# WHY THIS ONE FIRST
# smartlead_sync.py is the producer of replies_log.csv, which 20 scripts across
# three repos read. Everything else in the migration is downstream of it, so
# proving it in CI unblocks the rest.
#
# WHY ACTIONS AND NOT RAILWAY
# Measured runtime on the laptop is 565s against Actions' 6-hour ceiling. Same
# reasoning as hiring-pull.yml: this is minutes of API calls, not a long-running
# worker, so the ceiling is irrelevant and a cron trigger is the whole runtime.
#
# STATE: NONE. Cron enabled 2026-08-19.
# The CSV write is gone. The job reads its dedup set from Supabase and upserts
# back into it, so it holds nothing on disk between runs and a stateless runner
# is exactly the right place for it. Every reader was cut over first -- the
# three superseded SOS copies that still open the file carry a DO-NOT-RUN
# banner, and nothing on a schedule touches it.
#
# WHY THE DEDUP SET MOVED TOO. It used to be built by reading replies_log.csv.
# On a runner that file does not exist, so every reply would have looked new on
# every run: the upsert keeps the data correct, but "New rows added" becomes
# the total row count and the log stops meaning anything.

name: smartlead-sync

on:
  schedule:
    # 05:30 UTC = 13:30 KL. Must finish before reporting-site (06:10 UTC) reads
    # campaign_replies, or the page publishes without the day's replies.
    # Measured runtime is ~10-20 min, so this leaves ~40 minutes of headroom.
    - cron: "30 5 * * *"
  workflow_dispatch:
    inputs:
      days:
        description: "Sync replies from the last N days"
        required: false
        default: "14"
        type: string
      dry_run:
        description: "Print stats only, write nothing (safe to run any time)"
        required: false
        default: true
        type: boolean

concurrency:
  # Smartlead rate-limits per account, so a second concurrent run does not go
  # faster -- it 429s the first one.
  group: smartlead-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Sync replies
        env:
          SMARTLEAD_API_KEY: ${{ secrets.SMARTLEAD_API_KEY }}
          # The job only ever ran --dry-run before, which writes nothing, so it
          # never needed a database credential. A real run does.
          REPLIES_BACKEND: supabase
          REPORTING_SUPABASE_SERVICE_KEY: ${{ secrets.REPORTING_SUPABASE_SERVICE_KEY }}
          # The upsert goes over a direct Postgres connection (expression
          # index -- PostgREST returns 42P10), so it needs the DB password
          # as well as the REST service key. A repo secret is not visible
          # to a step unless it is named here.
          REPORTING_SUPABASE_DB_PASSWORD: ${{ secrets.REPORTING_SUPABASE_DB_PASSWORD }}
          # SOS_ROOT no longer points at anything the job writes; kept because
          # the module still derives DATA_DIR from it at import time.
          SOS_ROOT: ${{ github.workspace }}/_state
        run: |
          python scripts/smartlead_sync.py \
            --days "${{ github.event.inputs.days || '14' }}" \
            ${{ (github.event_name == 'workflow_dispatch' && github.event.inputs.dry_run != 'false') && '--dry-run' || '' }}
